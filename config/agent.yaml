# Agent Manifest — AgentRegistry entry point
# AgentRegistry (mediator/registry/agent_registry.py) reads every key below at
# ROOT level — do NOT nest keys under an `agent:` block. That nested shape is
# invisible to the registry (falls back to defaults / KeyErrors); see CLAUDE.md
# §5-0 "AgentRegistry manifest schema" for the full contract.
id: "MFG-C2-023"
name: "EcrClassificationImpactAgent"
namespace: "mfg"
version: "0.1.2"
enabled: true
category: "Cat 2"
# Static generation contract: impact classification and PPAP recommendation call
# an LLM when Azure OpenAI credentials are provisioned, and fall back to the
# deterministic rule engine when they are not.
generation_mode: "llm"
industry: "MFG"

# Opaque compatibility metadata. Not an inheritance selector or gate input.
base_type: "DocGenerationAgent"

# Entry point — single dotted import path (module.Class), NOT split module:/class:.
# AgentRegistry does `manifest["class"].rsplit(".", 1)` to get (module, class_name).
class: "src.graph.graph.ECRClassificationGraph"

# Security — the runner (shared/bootstrap/marketplace_app.py) stamps VERIFIED_EXTERNAL.
required_trust_level: "VERIFIED_EXTERNAL"

# Compile-time gates (AgentRegistry._compile_and_cache).
# requires.secrets is intentionally EMPTY: require_at_compile() hard-fails a
# listed-but-absent secret (-> 503), while src/services/llm_resolver.py reads
# the Azure keys defensively and degrades to the deterministic rule engine when
# they are missing. Listing them here would break a credential-less deployment
# that is meant to boot.
requires:
  secrets: []
  extras: ["openai"]  # AzureOpenAIClient is backed by langchain_openai (EXTRAS_MAP: openai)

# Runtime parameters (max_retry, timeout_s, ...) live in config/config.yaml —
# AgentRegistry loads that file separately and passes it as Graph(config=...).

[project]
name = "mfg-c2-023"
version = "0.1.0"
description = "ECR Classification and Impact Assessment Agent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# provided by CI per repo arm — ci_stubs/ on PYTHONPATH for ci_stubs-era repos,
# or installed from the package registry for wheel-era repos (see the dual-mode
# run-tests job in .gitlab-ci.yml). Pinning it here would make `pip install -e .`
# fail because it is not resolvable from the default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    # config_loader (config/config.yaml) and the PB-7 stub both import yaml;
    # relying on the wheel pulling it in transitively leaves it undeclared.
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# `AgentBaseGraph` / `GraphNode` / `FunctionNode` come from a wheel that ships no
# py.typed, so mypy resolves them to Any and strict's disallow_subclassing_any
# reports the inheritance CLAUDE.md §2-1 actually requires. Declaring the fact
# once here beats scattering per-node `# type: ignore[misc]`.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# Fleet-standard: the wheel ships no py.typed, so framework.*/shared.* read as
# "installed but untyped". This declares that fact -- it is NOT
# disable_error_code, which would suppress checking of our own code.
# Remove this section and re-measure once the wheel ships py.typed.
module = ["framework.*", "shared.*", "langgraph.*", "langchain_core.*"]
ignore_missing_imports = true
